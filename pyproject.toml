[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgnews"
version = "0.1.0"
description = "Telangana news to Telugu Instagram posts bot"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "httpx",
  "feedparser",
  "Pillow",
  "anthropic",
  "boto3",
  "pyyaml",
]

[project.scripts]
tgnews = "tgnews.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tgnews = ["blocklist.yaml", "assets/fonts/*.ttf", "assets/fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
