name: tgnews story sample

on:
  workflow_dispatch:

# Single shared group for ALL tgnews workflows, so two runs never overlap. A new run does not
# cancel one already in progress.
concurrency:
  group: tgnews
  cancel-in-progress: false

# Least privilege: the job only reads the repository. Everything else goes through secrets.
permissions:
  contents: read

jobs:
  story-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tgnews
        run: python -m pip install -e "."
      - name: Draw three test story scenes and send them to Telegram
        run: tgnews story-sample
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: story-sample
          path: story-sample/
