name: tgnews daily viral

on:
  schedule:
    # Trending-topic reels: four fixed ones a day plus two flex slots (07:30, 09:30, 11:30, 15:30, 17:30 and
    # 19:30 IST). GitHub drops and delays scheduled runs, so this fires every hour from 07:30 to 20:30 IST: a
    # run makes the reel for its own slot, or catches up on an earlier slot that was missed (one reel per
    # run; slots already made are skipped). A flex slot only makes a reel on days when the learning loop says
    # trending topics reach more people than news articles. The slot comes from the UTC hour the run starts
    # in (src/tgnews/viral.py SLOTS).
    - cron: "5 2-14 * * *"
  workflow_dispatch:

# Single shared group for ALL tgnews workflows, so two runs never overlap. A new run does not
# cancel one already in progress.
concurrency:
  group: tgnews
  cancel-in-progress: false

# Least privilege: the jobs only read the repository. Everything else goes through secrets.
permissions:
  contents: read

jobs:
  daily-viral:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries for Telugu text shaping
        run: |
          sudo apt-get update
          sudo apt-get install -y libraqm0 libfribidi0 libharfbuzz0b ffmpeg
      - name: Install tgnews
        run: python -m pip install -e ".[postgres,reels,viral]"
      - name: Make today's viral reel
        run: tgnews daily-viral
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER }}
          IMAGES_GH_TOKEN: ${{ secrets.IMAGES_GH_TOKEN }}
          IMAGES_GH_REPO: ${{ vars.IMAGES_GH_REPO }}
          IMAGES_GH_BRANCH: ${{ vars.IMAGES_GH_BRANCH }}
          IMAGES_PUBLIC_BASE: ${{ vars.IMAGES_PUBLIC_BASE }}
          IMAGES_VIDEO_BASE: ${{ vars.IMAGES_VIDEO_BASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          REEL_VOICE: ${{ vars.REEL_VOICE }}
          REEL_RATE: ${{ vars.REEL_RATE }}
          REEL_STYLE: ${{ vars.REEL_STYLE }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
