name: tgnews publish approved

on:
  schedule:
    # Every 30 minutes from 01:00 to 17:30 UTC (06:30 to 23:00 IST). Approvals therefore publish
    # with up to ~30 minutes of delay. Two entries because one cron cannot express 17:00 and 17:30 only.
    - cron: "0,30 1-16 * * *" # 06:30-22:30 IST, half-hourly
    - cron: "0,30 17 * * *"   # 22:30 and 23:00 IST
  workflow_dispatch:

# Single shared group for ALL tgnews workflows, so two runs never overlap. This is the guard
# against overlapping runs double-posting. A new run does not cancel one already in progress.
concurrency:
  group: tgnews
  cancel-in-progress: false

# Least privilege: the jobs only read the repository. Everything else goes through secrets.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Telugu text needs complex-script shaping; the app refuses to start without raqm.
      - name: Install system libraries for Telugu text shaping
        run: |
          sudo apt-get update
          sudo apt-get install -y libraqm0 libfribidi0 libharfbuzz0b
      # DATABASE_URL must be a HOSTED Postgres URL (runners have no persistent disk); never sqlite here.
      - name: Install tgnews
        run: python -m pip install -e ".[postgres]"
      - name: Collect Telegram decisions and publish approved posts
        run: tgnews publish-approved
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_VERSION: ${{ secrets.IG_API_VERSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ vars.MODE || 'review' }}
          DAILY_CAP: ${{ vars.DAILY_CAP }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          TIME_SLOTS: ${{ vars.TIME_SLOTS }}
          ACTIVE_SLOT_COUNT: ${{ vars.ACTIVE_SLOT_COUNT }}
