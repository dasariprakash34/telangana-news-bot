name: tgnews post

on:
  schedule:
    # Keep in sync with DEFAULT_TIME_SLOTS in src/tgnews/config.py ("02:00", "07:00", "13:00", "15:30" UTC).
    # tests/test_workflows.py fails if they drift. If you set the TIME_SLOTS variable, edit these too.
    - cron: "0 2 * * *"   # 07:30 IST
    - cron: "0 7 * * *"   # 12:30 IST
    - cron: "0 13 * * *"  # 18:30 IST
    - cron: "30 15 * * *" # 21:00 IST
  workflow_dispatch:

# Single shared group for ALL tgnews workflows, so two runs never overlap. This is the guard
# against overlapping runs double-posting. A new run does not cancel one already in progress.
concurrency:
  group: tgnews
  cancel-in-progress: false

# Least privilege: the jobs only read the repository. Everything else goes through secrets.
permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Telugu text needs complex-script shaping; the app refuses to start without raqm.
      - name: Install system libraries for Telugu text shaping
        run: |
          sudo apt-get update
          sudo apt-get install -y libraqm0 libfribidi0 libharfbuzz0b
      # DATABASE_URL must be a HOSTED Postgres URL (runners have no persistent disk); never sqlite here.
      - name: Install tgnews
        run: python -m pip install -e ".[postgres]"
      - name: Draft or post new stories
        run: tgnews run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_VERSION: ${{ secrets.IG_API_VERSION }}
          STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER }}
          IMAGES_GH_TOKEN: ${{ secrets.IMAGES_GH_TOKEN }}
          IMAGES_GH_REPO: ${{ vars.IMAGES_GH_REPO }}
          IMAGES_GH_BRANCH: ${{ vars.IMAGES_GH_BRANCH }}
          IMAGES_PUBLIC_BASE: ${{ vars.IMAGES_PUBLIC_BASE }}
          # STORAGE_* below are read only when STORAGE_PROVIDER=s3 (may be left unset).
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_PUBLIC_BASE: ${{ secrets.STORAGE_PUBLIC_BASE }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ vars.MODE || 'review' }}
          DAILY_CAP: ${{ vars.DAILY_CAP }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          TIME_SLOTS: ${{ vars.TIME_SLOTS }}
          ACTIVE_SLOT_COUNT: ${{ vars.ACTIVE_SLOT_COUNT }}
          PER_RUN_CAP: ${{ vars.PER_RUN_CAP }}
          IGNORE_SLOTS: ${{ vars.IGNORE_SLOTS }}
      - name: Publish approved drafts
        if: ${{ !cancelled() }}
        run: tgnews publish-approved
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_VERSION: ${{ secrets.IG_API_VERSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ vars.MODE || 'review' }}
          DAILY_CAP: ${{ vars.DAILY_CAP }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          TIME_SLOTS: ${{ vars.TIME_SLOTS }}
          ACTIVE_SLOT_COUNT: ${{ vars.ACTIVE_SLOT_COUNT }}
          PER_RUN_CAP: ${{ vars.PER_RUN_CAP }}
