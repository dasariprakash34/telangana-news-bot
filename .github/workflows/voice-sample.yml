name: tgnews voice sample

on:
  workflow_dispatch:

# Single shared group for ALL tgnews workflows, so two runs never overlap. A new run does not
# cancel one already in progress.
concurrency:
  group: tgnews
  cancel-in-progress: false

# Least privilege: the job only reads the repository. Everything else goes through secrets.
permissions:
  contents: read

jobs:
  voice-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tgnews
        run: python -m pip install -e "."
      - name: Send three test voices to Telegram
        run: tgnews voice-sample
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
