name: tgnews story

on:
  schedule:
    # One illustrated Telangana story reel a day (config/stories.yaml), drafted at 07:05 IST so it is in
    # Telegram for approval well before the evening. Like every reel it is posted only after approval.
    - cron: "35 1 * * *"
  workflow_dispatch:
  push:
    branches: [story-sample]  # push to this branch to try a story before the workflow is on main

# Single shared group for ALL tgnews workflows, so two runs never overlap. A new run does not
# cancel one already in progress.
concurrency:
  group: tgnews
  cancel-in-progress: false

# Least privilege: the jobs only read the repository. Everything else goes through secrets.
permissions:
  contents: read

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries for Telugu text shaping
        run: |
          sudo apt-get update
          sudo apt-get install -y libraqm0 libfribidi0 libharfbuzz0b ffmpeg
      - name: Install tgnews
        run: python -m pip install -e ".[postgres,reels]"
      - name: Make the next story reel
        run: tgnews story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER }}
          IMAGES_GH_TOKEN: ${{ secrets.IMAGES_GH_TOKEN }}
          IMAGES_GH_REPO: ${{ vars.IMAGES_GH_REPO }}
          IMAGES_GH_BRANCH: ${{ vars.IMAGES_GH_BRANCH }}
          IMAGES_PUBLIC_BASE: ${{ vars.IMAGES_PUBLIC_BASE }}
          IMAGES_VIDEO_BASE: ${{ vars.IMAGES_VIDEO_BASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          REEL_VOICE: ${{ vars.REEL_VOICE }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
